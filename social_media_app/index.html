<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassy Social</title>
  <meta name="description" content="A premium‑looking single‑page social media app built with vanilla HTML, CSS, and JavaScript.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Glassy Social</h1>
    <nav>
      <button id="nav-feed" class="nav-btn active">Feed</button>
      <button id="nav-profile" class="nav-btn">Profile</button>
      <button id="nav-login" class="nav-btn">Log In</button>
    </nav>
  </header>

  <main id="app-main">
    <!-- Feed view -->
    <section id="feed-view" class="view">
      <div class="new-post">
        <textarea id="post-content" placeholder="What's on your mind?" rows="3"></textarea>
        <button id="post-submit" class="primary-btn">Post</button>
      </div>
      <div id="feed" class="feed-container"></div>
    </section>

    <!-- Profile view -->
    <section id="profile-view" class="view hidden">
      <h2 id="profile-username"></h2>
      <div id="profile-feed" class="feed-container"></div>
    </section>

    <!-- Login / Register modal -->
    <div id="auth-modal" class="modal hidden">
      <div class="modal-content">
        <span class="close" id="auth-close">&times;</span>
        <h2 id="auth-title">Log In</h2>
        <input type="text" id="auth-username" placeholder="Username" />
        <button id="auth-submit" class="primary-btn">Continue</button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
